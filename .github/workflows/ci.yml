name: QA automation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API · Newman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Run API regression
        run: npm run test:api
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: reports/api

  testcafe:
    name: UI · TestCafe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Run TestCafe suite
        run: npm run test:testcafe
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testcafe-report
          path: reports/testcafe

  cypress:
    name: UI · Cypress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Cypress suite
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: reports/cypress
